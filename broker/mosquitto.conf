# IRON-MQTT broker: mutual TLS only. There is deliberately NO plaintext 1883 listener.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

per_listener_settings false
allow_anonymous false
acl_file /mosquitto/config/acl

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
# Every client must present a cert signed by the range CA; its CN becomes the MQTT
# username, which the ACL uses. A client cannot claim an identity it has no key for.
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
