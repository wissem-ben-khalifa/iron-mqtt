# IRON-MQTT range. Device services live in compose.devices.yaml (generated by
# scripts/gen_devices.py). ./iron sets COMPOSE_FILE=compose.yaml:compose.devices.yaml;
# if you call docker compose directly, pass both files with -f.
name: iron-mqtt

x-app: &app
  # Built locally by `./iron build`. pull_policy never: a missing image must fail
  # loudly, not be fetched from a public registry under the same name.
  image: iron-mqtt/app:dev
  pull_policy: never
  restart: unless-stopped

networks:
  # Devices, broker, attacker. Fixed subnet so IPs in evidence and labels are stable.
  iot_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Data plane: MongoDB and the services that use it. Devices are NOT attached here.
  backend_net:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mongo-data:

services:
  broker:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    # Run as the host user so the 0600 broker key stays 0600.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - ./certs/ca/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/broker/broker.crt:/mosquitto/certs/broker.crt:ro
      - ./certs/broker/broker.key:/mosquitto/certs/broker.key:ro
    networks:
      iot_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      # Healthy = something accepts TCP on 8883 (busybox nc in the image). Each probe
      # logs a harmless "Protocol error" on loopback, so probe fast only during startup.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883"]
      start_period: 30s
      start_interval: 2s
      interval: 60s
      timeout: 3s
      retries: 3

  # Capture sensor: shares the broker's network namespace, so it sees every packet to
  # and from the broker (a separate container on a switched bridge would not).
  # Writes 5-second rotating pcaps; the detector consumes completed chunks.
  # NOTE: if the broker container is recreated, recreate the sensor too.
  sensor:
    image: iron-mqtt/netutils
    pull_policy: never
    network_mode: "service:broker"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    restart: unless-stopped
    volumes:
      - ./captures:/captures
    command: >-
      tcpdump -i eth0 -p -n -s 0 -U -G 5
      -w /captures/live/%Y%m%dT%H%M%S.pcap
    depends_on:
      broker:
        condition: service_healthy

  # MongoDB as a single-node replica set (change streams need one), with access
  # control on. A replica set with auth requires a keyfile for internal auth.
  mongo:
    image: mongo:8@sha256:d0c8f51bb63fb1f992f4ff05293adb3f0967aaaae32c3e5fa567907800819b3b
    restart: unless-stopped
    # mongod demands its keyfile be owned by its own user with mode 400: copy it in at
    # start rather than loosening the host file (secrets/mongo-keyfile, mode 600).
    entrypoint:
      - bash
      - -c
      - install -m 400 -o mongodb -g mongodb /run/secrets-in/mongo-keyfile /tmp/mongo-keyfile && exec docker-entrypoint.sh "$$@"
      - --
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/tmp/mongo-keyfile",
              "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run ./iron secrets first}
    volumes:
      - mongo-data:/data/db
      - ./secrets/mongo-keyfile:/run/secrets-in/mongo-keyfile:ro
    networks:
      backend_net:
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot: replica set, per-service users/roles, validators, indexes, time-series.
  mongo-init:
    <<: *app
    restart: "no"
    command: ["python", "-m", "services.dbinit"]
    environment:
      MONGO_ROOT_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_INGEST_PASSWORD: ${MONGO_INGEST_PASSWORD}
      MONGO_DETECTOR_PASSWORD: ${MONGO_DETECTOR_PASSWORD}
      MONGO_API_PASSWORD: ${MONGO_API_PASSWORD}
      MONGO_ANALYST_PASSWORD: ${MONGO_ANALYST_PASSWORD}
    networks: [backend_net]
    depends_on:
      mongo:
        condition: service_healthy

  ingest:
    <<: *app
    command: ["python", "-m", "services.ingest"]
    environment:
      MONGO_URI: mongodb://ingest:${MONGO_INGEST_PASSWORD}@mongo:27017/iron?authSource=iron&replicaSet=rs0
    volumes:
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
      - ./certs/services/ingest.crt:/certs/client.crt:ro
      - ./certs/services/ingest.key:/certs/client.key:ro
    networks:
      iot_net:
        ipv4_address: 172.28.0.20
      backend_net:
    depends_on:
      broker:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  # Control plane. Published on localhost only (WSL forwards it to Windows):
  # http://localhost:8000/docs
  api:
    <<: *app
    command: ["python", "-m", "services.api"]
    environment:
      API_TOKEN: ${API_TOKEN}
      ATTACKER_URL: http://attacker:8080
      # DEV_UI=1 serves the break-ui worst-case toggle at /ui-dev. Off unless set explicitly.
      DEV_UI: ${DEV_UI:-0}
      MONGO_URI: mongodb://api:${MONGO_API_PASSWORD}@mongo:27017/iron?authSource=iron&replicaSet=rs0
    volumes:
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
      - ./certs/services/api.crt:/certs/client.crt:ro
      - ./certs/services/api.key:/certs/client.key:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      iot_net:
        ipv4_address: 172.28.0.30
      backend_net:
    depends_on:
      broker:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      start_period: 30s
      start_interval: 2s
      interval: 30s

  # Attacker agent (M5): compromised-device flood. iot_net only, no published port,
  # target hard-fixed to the broker. Triggered by the control-plane API over HTTP.
  attacker:
    <<: *app
    command: ["python", "-m", "services.attacker"]
    environment:
      COMPROMISED_DEVICE: device-07
    volumes:
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
      - ./certs/devices/device-07.crt:/certs/client.crt:ro
      - ./certs/devices/device-07.key:/certs/client.key:ro
    networks:
      iot_net:
        ipv4_address: 172.28.0.40
    depends_on:
      broker:
        condition: service_healthy

  # Live detector (M7): scores capture chunks with the active model, writes incidents.
  detector:
    <<: *app
    command: ["python", "-m", "services.detector"]
    environment:
      MONGO_URI: mongodb://detector:${MONGO_DETECTOR_PASSWORD}@mongo:27017/iron?authSource=iron&replicaSet=rs0
      CAPTURE_DIR: /captures/live
      MODELS_DIR: /models
      THRESHOLD_PAYLOAD_UP: "13737"
      # Pin the live model. Without it the detector falls back to the newest registered
      # model, which is now a 1-feature window-level research model (m0006).
      MODEL_VERSION: m0001
    volumes:
      - ./captures:/captures:ro
      - ./models:/models:ro
    networks: [backend_net]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  tests:
    <<: *app
    profiles: [test]
    restart: "no"
    command: ["pytest", "-q", "-rA", "tests"]
    environment:
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      MONGO_URI: mongodb://analyst:${MONGO_ANALYST_PASSWORD}@mongo:27017/iron?authSource=iron&replicaSet=rs0
      # Only to prove validation and privilege boundaries on writes (tests/test_mongo.py).
      MONGO_INGEST_URI: mongodb://ingest:${MONGO_INGEST_PASSWORD}@mongo:27017/iron?authSource=iron&replicaSet=rs0
      # Only to insert pipeline self-test incidents (kind=test) for the WebSocket test.
      MONGO_DETECTOR_URI: mongodb://detector:${MONGO_DETECTOR_PASSWORD}@mongo:27017/iron?authSource=iron&replicaSet=rs0
      API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN}
    volumes:
      - ./certs:/pki:ro
      - ./captures:/captures
      - ./models:/models
    networks:
      iot_net:
        ipv4_address: 172.28.0.250
      backend_net:
    depends_on:
      broker:
        condition: service_healthy
